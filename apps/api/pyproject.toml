[project]
name = "looplish-api"
version = "0.1.0"
description = "Looplish local media processing API"
requires-python = "==3.13.*"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=3.5,<4",
  "platformdirs>=4.3,<5",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.1.1"
]

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.2,<2"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["looplish_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# 注释与文案使用中文全角标点，不视为易混淆字符。
allowed-confusables = ["，", "；", "：", "（", "）", "！", "？"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["looplish_api"]

[[tool.mypy.overrides]]
# yt-dlp 不带类型标注；faster-whisper 是可选依赖（local-asr），未安装时同样按 Any 处理。
module = ["yt_dlp", "yt_dlp.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
